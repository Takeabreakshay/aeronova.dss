# Render blueprint — one-click deploy from a GitHub repo.
# Point Render at this file after connecting the repo and it provisions
# the service, sets env vars, and wires the health check.
services:
  - type: web
    name: aeronova-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false        # set in Render dashboard, not committed
      - key: CORS_ORIGINS
        sync: false        # e.g. https://aeronova.vercel.app
