name: Keep Render warm

# Render free tier spins down after ~15 min idle. This job pings the
# backend every 8 minutes so it never fully sleeps, and retries through
# a cold start if it's already sleeping.

on:
  schedule:
    - cron: '*/8 * * * *'   # every 8 min — GitHub Actions cron may drift by a few min under load
  workflow_dispatch:         # allow manual runs from the Actions tab

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health with cold-start retries
        run: |
          URL='https://aeronova-dss.onrender.com/api/health'
          for i in 1 2 3 4; do
            code=$(curl -s -o /tmp/body.txt -w '%{http_code}' -m 60 "$URL" || echo '000')
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "warm ✓"
              cat /tmp/body.txt
              exit 0
            fi
            sleep 15
          done
          echo "All attempts failed"
          cat /tmp/body.txt || true
          exit 1
